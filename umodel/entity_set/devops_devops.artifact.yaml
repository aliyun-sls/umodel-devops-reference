            en_us: Security Scan Status
            zh_cn: 安全扫描状态 passed/failed/skipped/in_progress
          type: enum
        - description:
            en_us: Vulnerability count
            zh_cn: 漏洞数量
          display_name:
            en_us: Vulnerability Count
            zh_cn: 漏洞数量
          filterable: true
          name: vulnerability_count
          orderable: true
          short_description:
            en_us: Vulnerability Count
            zh_cn: 漏洞数量
          type: integer
        - description:
            en_us: Vulnerability severity stats
            zh_cn: 漏洞严重级别统计
          display_name:
            en_us: Vulnerability Severity
            zh_cn: 漏洞严重级别统计
          filterable: false
          name: vulnerability_severity
          orderable: false
          short_description:
            en_us: Vulnerability Severity
            zh_cn: 漏洞严重级别统计
          type: json
        - description:
