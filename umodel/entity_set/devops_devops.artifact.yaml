            zh_cn: 创建者
          filterable: true
          name: created_by
          orderable: true
          short_description:
            en_us: Created By
            zh_cn: 创建者
          type: string
    keep_alive_seconds: 86400
    name_fields:
        - name
        - artifact_id
        - version
    primary_key_fields:
        - artifact_id
    time_field: __time__
    type: entity_set
