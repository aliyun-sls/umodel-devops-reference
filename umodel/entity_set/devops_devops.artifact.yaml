kind: entity_set
metadata:
    description:
        en_us: Abstract/unified entity representing pipeline build artifacts, linked via same_as to concrete types.
        zh_cn: 构建产物实体是抽象/通用实体，统一表示流水线构建产生的各类产物（派生实体，决策B）。
    display_name:
        en_us: Artifact
        zh_cn: 构建产物
    domain: devops
    kind: entity_set
    name: devops.artifact
schema:
    url: umodel.aliyun.com
    version: v0.1.0
spec:
    dynamic: false
    fields:
        - description:
            en_us: Artifact unique identifier
            zh_cn: 产物唯一标识
          display_name:
            en_us: Artifact Id
            zh_cn: 产物唯一标识
          filterable: true
          name: artifact_id
          orderable: true
          short_description:
            en_us: Artifact Id
            zh_cn: 产物唯一标识
          type: string
        - description:
            en_us: Artifact name
            zh_cn: 产物名称
          display_name:
            en_us: Name
            zh_cn: 产物名称
          filterable: true
          name: name
          orderable: true
          short_description:
            en_us: Name
            zh_cn: 产物名称
          type: string
        - description:
            en_us: Version
            zh_cn: 版本号
          display_name:
            en_us: Version
            zh_cn: 版本号
          filterable: true
          name: version
          orderable: true
          short_description:
            en_us: Version
            zh_cn: 版本号
          type: string
        - description:
