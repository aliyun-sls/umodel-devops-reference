services:
  data-generator:
    build:
      context: ./devops_data_generator
      dockerfile: Dockerfile
    container_name: umodel-devops-generator
    restart: unless-stopped
    volumes:
      - ./devops_data_generator/config:/app/config:ro
      - ./devops_data_generator/logs:/app/logs
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["python3", "main.py", "--mode", "continuous", "--config", "/app/config"]
    # main.py --mode continuous runs no HTTP listener, so the Dockerfile's
    # Flask :5000 healthcheck would always mark the container unhealthy; disable it.
    healthcheck:
      test: ["NONE"]

  umodel-schema-uploader:
    build:
      context: .
      dockerfile: umodel_uploader/Dockerfile
    image: umodel-devops-schema-uploader:latest
    container_name: umodel-devops-schema-uploader
    restart: "no"
    environment:
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
    volumes:
      - ./umodel:/app/umodel:ro
    command:
      - python3
      - umodel_uploader/umodel_batch_uploader.py
      - umodel
      - --endpoint
      - ${UMODEL_ENDPOINT:-metrics.cn-hongkong.aliyuncs.com}
      - --workspace
      - ${UMODEL_WORKSPACE:?UMODEL_WORKSPACE must be set (configure it in .env)}

# Usage:
#   1. Copy the sample config for your provider:
#      cp devops_data_generator/config/app_config.gitlab.yaml.sample \
#         devops_data_generator/config/app_config.yaml
#      # or
#      cp devops_data_generator/config/app_config.codeup.yaml.sample \
#         devops_data_generator/config/app_config.yaml
#
#   2. Fill in credentials in app_config.yaml
#
#   3. Run:
#      docker compose up --build
