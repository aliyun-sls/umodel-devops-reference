# 静态Topo配置文件
# 保留 baseline 的静态/混合关系机制，但将业务样例收缩为 GitLab 单仓库 demo 模板。
# 所有 repo 标识统一使用 GitLab path_with_namespace 口径。
# 实体命名遵循 docs/umodel-entity-field-contract.md（user/repository/release 等）。

metadata:
  description: "静态拓扑关系配置文件（GitLab 单仓库 demo 模板）"
  version: "3.0.0"
  last_updated: "2026-06-18"

topo_definitions:
  - name: "apm.service_sourced_from_devops.repository"
    type: "static"
    description: "服务到代码仓库的静态关系模板"
    relationship_type: "sourced_from"
    relations:
      - source_entity_type: "apm.service"
        source_domain: "apm"
        source_entity_id: "<APM_SERVICE_ENTITY_ID>"
        target_domain: "devops"
        target_entity_type: "devops.repository"
        target_entity_id: "<REPOSITORY_ENTITY_ID_MD5>"
        attributes:
          apm_service: "<APM_SERVICE_NAME>"
          repository: "<GITLAB_PATH_WITH_NAMESPACE>"

  - name: "apm.service_sourced_from_devops.release"
    type: "mixed"
    description: "静态 apm.service 与动态 release 的关系模板"
    relationship_type: "sourced_from"
    static_entity_type: "apm.service"
    relation_direction: "static_to_dynamic"
    source_domain: "apm"
    target_domain: "devops"
    static_entities:
      - entity_id: "<APM_SERVICE_ENTITY_ID>"
        name: "<APM_SERVICE_NAME>"
        service_name: "<APM_SERVICE_NAME>"
        repository_name: "<GITLAB_PATH_WITH_NAMESPACE>"
        domain: "apm"
    dynamic_entity:
      entity_type: "devops.release"
      domain: "devops"
    match_rule:
      static_field: "repository_name"
      dynamic_field: "name"
      type: "exact"
    attributes:
      relationship_type: "sourced_from"

  - name: "devops.user_manages_apm.service"
    type: "mixed"
    description: "静态 apm.service 与动态 user 的关系模板（旧 developer_manages 重命名）"
    relationship_type: "manages"
    static_entity_type: "apm.service"
    relation_direction: "static_to_dynamic"
    source_domain: "apm"
    target_domain: "devops"
    static_entities:
      - entity_id: "<APM_SERVICE_ENTITY_ID>"
        name: "<APM_SERVICE_NAME>"
        service_name: "<APM_SERVICE_NAME>"
        repository_name: "<GITLAB_PATH_WITH_NAMESPACE>"
        domain: "apm"
        user_id: "<USER_ID>"
    dynamic_entity:
      entity_type: "devops.user"
      domain: "devops"
    match_rule:
      static_field: "user_id"
      dynamic_field: "user_id"
      type: "exact"
    attributes:
      relationship_type: "manages"

  - name: "devops.user_owns_devops.repository"
    type: "dynamic_to_dynamic"
    description: "动态 user 与动态 repository 的归属关系模板（旧 developer_manages_code_repository）"
    relationship_type: "owns"
    source_domain: "devops"
    target_domain: "devops"
    source_entity:
      entity_type: "devops.user"
      data_key: "devops.user_raw_data"
      id_field: "user_id"
    target_entity:
      entity_type: "devops.repository"
      data_key: "repositories"
      id_field: "repository_id"
    relationship_mapping:
      - source_filter:
          user_id: "<USER_ID>"
        target_filter:
          name: "<GITLAB_PATH_WITH_NAMESPACE>"
        attributes:
          role: "maintainer"
          access_level: "40"

examples:
  notes:
    - "把 <GITLAB_PATH_WITH_NAMESPACE> 替换为真实 GitLab 仓库标识，例如 group/project。"
    - "把所有 <...> 占位符替换为当前 demo 的真实实体名、实体ID 或 user_id。"
    - "如果当前 demo 不接 APM 或静态归属关系，可以删除对应 topo_definition。"
    - "image_registry 相关静态关系已随实体移除（决策 A）。"
