# 数据映射配置（producer 支撑子集）
# 说明：本文件只列出有 producer 实际生产数据的实体与关系，避免悬空配置（D1 已清除）。
# 全量 17 EntitySet + 36 EntitySetLink 的「定义」在 umodel/entity_set/ 与 umodel/entity_set_link/。
# 字段契约 SSOT：docs/umodel-entity-field-contract.md
# data_source 枚举：docs/data-source-enum-spec.md

entity:
  user:
    # git adapter list_repository_members() 输出归一化字段（见 adapters/base.py）
    fields:
      - user_id
      - full_name
      - email
      - display_name
      - avatar_url
      - data_source
      - platform_user_id
      - department
      - is_active
    primaryKeys:
      - user_id
    __domain__: devops
    __entity_type__: devops.user

  repository:
    # git adapter list_repositories() 输出归一化字段
    fields:
      - repository_id
      - name
      - full_path
      - description
      - owner_id
      - data_source
      - platform_repo_id
      - url
      - default_branch
      - visibility
      - language
      - created_at
      - updated_at
    primaryKeys:
      - repository_id
    __domain__: devops
    __entity_type__: devops.repository

  release:
    # git adapter list_repository_releases() 输出归一化字段；release_type 由 release_classifier 推导
    fields:
      - release_id
      - repository_id
      - name
      - version
      - description
      - release_type
      - status
      - data_source
      - platform_release_id
      - url
      - created_by
      - tag_name
      - target_commitish
      - created_at
    primaryKeys:
      - release_id
    __domain__: devops
    __entity_type__: devops.release

  pull_request:
    # git adapter list_pull_requests() 输出归一化字段（IGitAdapter 扩展方法）
    fields:
      - pr_id
      - project_id
      - repository_id
      - number
      - title
      - description
      - author_id
      - source_branch
      - target_branch
      - status
      - data_source
      - platform_pr_id
      - url
      - commits_count
      - changed_files
      - additions
      - deletions
      - created_at
      - updated_at
    primaryKeys:
      - pr_id
    __domain__: devops
    __entity_type__: devops.pull_request

  pipeline:
    # CI 流水线定义（git adapter list_pipelines()；GitLab=项目 CI 配置文件）
    fields:
      - pipeline_id
      - repository_id
      - name
      - file_path
      - description
      - data_source
      - platform_pipeline_id
      - url
      - is_active
      - created_at
      - updated_at
    primaryKeys:
      - pipeline_id
    __domain__: devops
    __entity_type__: devops.pipeline

  pipeline_run:
    # CI 流水线执行（git adapter list_pipeline_runs()）
    fields:
      - run_id
      - pipeline_id
      - repository_id
      - number
      - pr_id
      - commit_sha
      - branch
      - trigger_type
      - status
      - conclusion
      - data_source
      - platform_run_id
      - url
      - triggered_by
      - stages
      - created_at
      - started_at
      - completed_at
      - duration_seconds
      - queue_duration_seconds
    primaryKeys:
      - run_id
    __domain__: devops
    __entity_type__: devops.pipeline_run

  artifact:
    # 派生实体（决策 B）：docker_image_task 一次 ACR fetch 同生 artifact + docker_image
    fields:
      - artifact_id
      - name
      - version
      - artifact_type
      - repository_id
      - commit_sha
      - tag_name
      - pipeline_run_id
      - storage_location
      - data_source
      - platform_artifact_id
      - url
      - created_at
      - created_by
    primaryKeys:
      - artifact_id
    __domain__: devops
    __entity_type__: devops.artifact

  docker_image:
    # ACR producer 输出；architecture/os 取正确字段（修 D12 bug）
    fields:
      - docker_image_id
      - artifact_id
      - registry
      - repository
      - tag
      - digest
      - full_image_name
      - base_image
      - platform
      - architecture
      - os
      - data_source
      - platform_image_id
      - created_at
    primaryKeys:
      - docker_image_id
    __domain__: devops
    __entity_type__: devops.docker_image

  kubernetes_pod:
    fields:
      - pod_id
      - entity_id
      - images
      - container_names
      - image_count
      - container_count
      - namespace
    primaryKeys:
      - entity_id
    use_field_as_entity_id: entity_id
    __domain__: k8s
    __entity_type__: k8s.pod

  deployment:
    # CD 系统（argocd 等）写入的部署实体；字段对齐 umodel/entity_set/devops_devops.deployment.yaml
    fields:
      - deployment_id
      - title
      - description
      - repository_id
      - run_id
      - environment_id
      - commit_sha
      - version
      - status
      - conclusion
      - data_source
      - platform_deployment_id
      - url
      - deployed_by
      - release_id
      - artifacts
      - created_at
      - started_at
      - completed_at
      - rollback_started_at
      - rollback_completed_at
      - duration_seconds
    primaryKeys:
      - deployment_id
    __domain__: devops
    __entity_type__: devops.deployment

topo:
  # --- git/ACR producer 可派生的关系（决策 G-2：设计文档动词原样落地） ---
  user_owns_repository:
    __src_domain__: devops
    __src_entity_type__: devops.user
    __dest_domain__: devops
    __dest_entity_type__: devops.repository
    src_entity_primarykeys:
      - user_id
    dest_entity_primarykeys:
      - repository_id
    fixed_fields:
      __link_type__: "owns"

  repository_tags_release:
    # 方向与旧 code_release_sourced_from_code_repository 相反（release→repo 改为 repo→release）
    __src_domain__: devops
    __src_entity_type__: devops.repository
    __dest_domain__: devops
    __dest_entity_type__: devops.release
    src_entity_primarykeys:
      - repository_id
    dest_entity_primarykeys:
      - release_id
    fixed_fields:
      __link_type__: "tags"

  repository_contains_pull_request:
    __src_domain__: devops
    __src_entity_type__: devops.repository
    __dest_domain__: devops
    __dest_entity_type__: devops.pull_request
    src_entity_primarykeys:
      - repository_id
    dest_entity_primarykeys:
      - pr_id
    fixed_fields:
      __link_type__: "contains"

  user_participates_in_pull_request:
    # 派生自 PR.author/reviewers
    __src_domain__: devops
    __src_entity_type__: devops.user
    __dest_domain__: devops
    __dest_entity_type__: devops.pull_request
    src_entity_primarykeys:
      - user_id
    dest_entity_primarykeys:
      - pr_id
    fixed_fields:
      __link_type__: "participates_in"

  release_contains_artifact:
    # 派生：release.tag_name 关联到 ACR 同 tag 的 artifact
    __src_domain__: devops
    __src_entity_type__: devops.release
    __dest_domain__: devops
    __dest_entity_type__: devops.artifact
    src_entity_primarykeys:
      - release_id
    dest_entity_primarykeys:
      - artifact_id
    fixed_fields:
      __link_type__: "contains"

  artifact_same_as_docker_image:
    # 决策 B：docker_image_task 同生产出（ACR 派生）
    __src_domain__: devops
    __src_entity_type__: devops.artifact
    __dest_domain__: devops
    __dest_entity_type__: devops.docker_image
    src_entity_primarykeys:
      - artifact_id
    dest_entity_primarykeys:
      - docker_image_id
    fixed_fields:
      __link_type__: "same_as"

  # --- 跨域（k8s） ---
  pod_uses_docker_image:
    __src_domain__: k8s
    __src_entity_type__: k8s.pod
    __dest_domain__: devops
    __dest_entity_type__: devops.docker_image
    src_entity_primarykeys:
      - entity_id
    dest_entity_primarykeys:
      - docker_image_id
    fixed_fields:
      __link_type__: "uses"
      priority: 5

  # --- CD 系统（argocd 等）派生 ---
  release_relates_to_deployment:
    __src_domain__: devops
    __src_entity_type__: devops.release
    __dest_domain__: devops
    __dest_entity_type__: devops.deployment
    src_entity_primarykeys:
      - release_id
    dest_entity_primarykeys:
      - deployment_id
    fixed_fields:
      __link_type__: "relates_to"
      priority: 5

  # --- CI 流水线（C-1）---
  repository_contains_pipeline:
    __src_domain__: devops
    __src_entity_type__: devops.repository
    __dest_domain__: devops
    __dest_entity_type__: devops.pipeline
    src_entity_primarykeys:
      - repository_id
    dest_entity_primarykeys:
      - pipeline_id
    fixed_fields:
      __link_type__: "contains"
      priority: 5

  pull_request_triggers_pipeline_run:
    __src_domain__: devops
    __src_entity_type__: devops.pull_request
    __dest_domain__: devops
    __dest_entity_type__: devops.pipeline_run
    src_entity_primarykeys:
      - pr_id
    dest_entity_primarykeys:
      - run_id
    fixed_fields:
      __link_type__: "triggers"
      priority: 5
