# 代码仓库与镜像仓库映射配置文件
# repo ↔ registry 静态映射，仓库标识统一改为 GitLab path_with_namespace。
# registry 现作为 docker_image.registry 字符串值（image_registry 实体已移除，决策 A）。

metadata:
  description: "代码仓库与镜像仓库映射配置（GitLab 单仓库 demo 模板）"
  version: "3.0.0"
  last_updated: "2026-06-18"

repo_image_mappings:
  "<GIT_REPO_PATH>": "<ACR_REGISTRY_NAME>"

tag_matching_rules:
  match_type: "exact"

examples:
  description: |
    配置说明：
    1. repo_image_mappings 使用 GitLab path_with_namespace 作为 repo 键，值指向 docker_image.registry（ACR 实例地址）。
    2. release_contains_artifact + artifact_same_as_docker_image 依赖静态 repo ↔ registry 映射 + tag matching（决策 B）。

    使用场景：
    - GitLab 仓库 "<GITLAB_PATH_WITH_NAMESPACE>" 的发布版本 "<RELEASE_TAG>"
    - 对应镜像仓库 "<ACR_REGISTRY_NAME>" 中的镜像标签 "<RELEASE_TAG>"
    - 自动建立 release_contains_artifact 与 artifact_same_as_docker_image 关系
